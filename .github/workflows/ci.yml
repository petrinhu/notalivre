---
# CI nativo do NotaLivre (NL-0.4, spike). Matriz das quatro distros, cada job num contêiner fixado por digest.
# Espelha tools/conteiner/build_local.sh: os mesmos scripts (instalar/<distro>.sh, medir_versoes.sh,
# precheque_qt.sh, executar_no_conteiner.sh), na mesma ordem. Tabela de versões no $GITHUB_STEP_SUMMARY (L-17).
# Actions fixadas por SHA de commit (decisão do orquestrador); o comentário ao lado é a versão.
# Estado: rodado no GitHub (runs https://github.com/petrinhu/notalivre/actions/runs/40235050696, .../40236959902 e .../40241779760; o último, 40241779760, em fb264f5, 9 jobs success; ver docs/pesquisa/ci_medicao.md).
name: ci

on:
  push:
    branches: ['onda-*', main]
  pull_request:

permissions:
  contents: read

# Base de temporários e de build (A0-08): padrão /var/tmp, trocável por variável; o preset exige NL_TMP_BASE.
# ZIP do XSD de Produção Restrita (NL-1.6c): URL e SHA-256 espelham third_party/nfse-xsd/prodrest-20261124/SHA256SUMS
# (o passo do cache confere essa igualdade antes de usar). A chave do cache é o SHA-256: conteúdo fixo, chave fixa.
env:
  NL_TMP_BASE: /var/tmp
  NL_XSD_ZIP_SHA256: 1ca83c1a7929f6d5684c9a17700fe3d3a375e4ea12b7ccb832bfc369768902c0
  NL_XSD_ZIP_URL: https://www.gov.br/nfse/pt-br/biblioteca/documentacao-tecnica/producao-restrita/esquemas-xsd-producao-restrita-20261124.zip
  # Espelho do mesmo ZIP (decisão do líder, 27/11/2026, "Release do GitHub como espelho (Recomendado)"): o gov.br recusa os
  # runners do GitHub (run 46007980323, SSL connect error em todas as tentativas). O download tenta primeiro NL_XSD_ZIP_URL
  # e, só se falhar no transporte, esta URL. O SHA-256 é conferido nas duas; divergência é fatal na hora.
  NL_XSD_ZIP_ESPELHO: https://github.com/petrinhu/notalivre/releases/download/espelho-xsd-prodrest-20261124/esquemas-xsd-producao-restrita-20261124.zip

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NL-3.0g: o Qt 6.12 é instalado por aqt uma só vez, na imagem ubuntu26.04 (que tem aqt), e fica no cache. As matrizes
  # só restauram: a imagem fedora45 não tem aqt (Python 3.15 sem wheels das dependências dele).
  qt-cache:
    name: qt-cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ubuntu@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
    defaults:
      run:
        shell: bash
    steps:
      # A imagem ubuntu26.04 não traz git: o checkout sai sem histórico e o script de instalação traz o git e o aqt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Git e aqt (script de instalação da imagem ubuntu26.04)
        run: |
          bash tools/conteiner/instalar/ubuntu26.04.sh
          echo "/opt/aqt/bin" >> "$GITHUB_PATH"

      - name: Cache do Qt 6.12 (aqt)
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt
          key: qt-6.12.0-linux_gcc_64-qtnetworkauth-qthttpserver-qtimageformats-qtshadertools-qtwebsockets-v1

      - name: Qt 6.12 com aqt (só em cache miss)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/qt"
          aqt install-qt -O "$RUNNER_TEMP/qt" linux desktop 6.12.0 linux_gcc_64 \
            -m qtnetworkauth qthttpserver qtimageformats qtshadertools qtwebsockets
          test -f "$RUNNER_TEMP/qt/6.12.0/gcc_64/lib/cmake/Qt6/Qt6Config.cmake"

  # NL-3.1v (plano B da seção 1.3 do plano do CTO, pela medição do run 45984901232): o actions/cache põe o caminho na versão
  # do cache, e o runner.temp do qt-cache, que roda em contêiner, vale /__w/_temp; no host vale /home/runner/work/_temp. O job
  # banco roda no host e não acha o cache do qt-cache: este job grava o Qt no host, com chave própria e o mesmo path literal
  # do job banco. Em miss, o aqt vem num venv do Python do runner, com a versão fixada (aqtinstall 3.3.0, a última no PyPI,
  # de 02/06/2025: a mesma que o pip sem versão dá ao qt-cache). NF-05, decisão do líder de 09/11/2026: no CI entra sem
  # pergunta, registrado no resumo deste job (o quê, onde, tamanho e motivo).
  qt-cache-host:
    name: qt-cache-host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Cache do Qt 6.12 no host (chave própria do host)
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt
          key: qt-6.12.0-linux_gcc_64-qtnetworkauth-qthttpserver-qtimageformats-qtshadertools-qtwebsockets-v1-host-v1

      - name: aqtinstall 3.3.0 num venv do Python do runner (só em cache miss)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --no-cache-dir aqtinstall==3.3.0

      - name: Qt 6.12 com aqt (só em cache miss; mesmos módulos do qt-cache)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/qt"
          "$RUNNER_TEMP/aqt-venv/bin/aqt" install-qt -O "$RUNNER_TEMP/qt" linux desktop 6.12.0 linux_gcc_64 \
            -m qtnetworkauth qthttpserver qtimageformats qtshadertools qtwebsockets

      - name: Qt6Config.cmake presente e resumo do cache
        env:
          NL_CACHE_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
        run: |
          test -f "$RUNNER_TEMP/qt/6.12.0/gcc_64/lib/cmake/Qt6/Qt6Config.cmake"
          {
            echo "## qt-cache-host (NL-3.1v, plano B do cache do Qt)"
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Cache hit | ${NL_CACHE_HIT:-false} |"
            echo "| Tamanho do Qt | $(du -sh "$RUNNER_TEMP/qt" | cut -f1) |"
            echo "| Motivo | job banco no host (NL-3.1v): o cache do qt-cache, gravado em contêiner, não casa no host |"
          } >> "$GITHUB_STEP_SUMMARY"

      # NF-05 (decisão do líder de 09/11/2026): o que entrou no CI, onde, tamanho e motivo, só quando entrou (cache miss).
      - name: Registro do que entrou no miss (pip freeze e tamanhos, NF-05)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          {
            echo "### Instalado neste run (cache miss)"
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Onde | venv em \$RUNNER_TEMP/aqt-venv; Qt 6.12.0 linux_gcc_64 e 5 módulos em \$RUNNER_TEMP/qt |"
            echo "| Python do runner | $(python3 --version 2>&1) |"
            echo "| Tamanho do venv | $(du -sh "$RUNNER_TEMP/aqt-venv" | cut -f1) |"
            echo "| Tamanho do Qt | $(du -sh "$RUNNER_TEMP/qt" | cut -f1) |"
            echo
            echo "pip freeze do venv:"
            echo '```'
            "$RUNNER_TEMP/aqt-venv/bin/pip" freeze
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # NL-3.1v (run 45985663535): o job banco roda no host e não acha o cache do ZIP do XSD dos jobs nativos, gravado em
  # contêiner (o actions/cache põe o caminho na versão do cache), e o gov.br caiu 5 vezes com "SSL connect error" a partir
  # do runner. Este job, na mesma imagem do qt-cache e com o mesmo path e a mesma chave dos jobs nativos, restaura o
  # cache, confere o SHA-256 contra o manifesto e entrega o ZIP ao job banco por artefato, 1 dia.
  # NL-3.L: chave nova (leiaute de 24/11/2026). No cache miss, o job baixa do gov.br como o nativo (cmake -P, 5 tentativas por URL,
  # e o espelho, SHA-256 conferido), no lugar do fail-on-cache-miss: com a chave nova o primeiro run é sempre miss, e sem o download o
  # xsd-cache reprova e o banco (needs) não roda. O cmake e as raízes de TLS entram pelo apt da imagem, só no miss (NF-05).
  xsd-cache:
    name: xsd-cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: ubuntu@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache do ZIP do XSD (mesmo path e chave dos jobs nativos)
        id: xsd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xsd-cache
          key: xsd-prodrest-20261124-1ca83c1a7929f6d5684c9a17700fe3d3a375e4ea12b7ccb832bfc369768902c0

      # Só no miss: cmake e ca-certificates pelo apt da imagem (NF-05, no CI sem pergunta, registrado no resumo) e o ZIP
      # pelo mesmo tools/ci/baixar_zip_xsd.cmake do nativo. O SHA-256 é conferido depois do download; divergência é fatal na hora.
      - name: ZIP do XSD do gov.br (só em cache miss; 5 tentativas, SHA-256 conferido)
        if: steps.xsd-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends cmake ca-certificates
          pasta="$RUNNER_TEMP/xsd-cache"
          mkdir -p "$pasta"
          grep -q -F "# ZIP SHA-256: $NL_XSD_ZIP_SHA256 " third_party/nfse-xsd/prodrest-20261124/SHA256SUMS
          cmake -DNL_URLS="$NL_XSD_ZIP_URL;$NL_XSD_ZIP_ESPELHO" -DNL_DESTINO="$pasta/esquemas-xsd-producao-restrita-20261124.zip" \
                -DNL_SHA256="$NL_XSD_ZIP_SHA256" -P tools/ci/baixar_zip_xsd.cmake
          {
            echo "## xsd-cache: instalado neste run (cache miss, NF-05)"
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| O quê | cmake $(cmake --version | head -1 | cut -d' ' -f3) e ca-certificates, pelo apt da imagem |"
            echo "| Onde | contêiner do job xsd-cache |"
            echo "| ZIP baixado | $(stat -c %s "$pasta/esquemas-xsd-producao-restrita-20261124.zip") bytes |"
            echo "| Motivo | chave nova do cache do ZIP do XSD (leiaute de 24/11/2026, NL-3.L) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SHA-256 do ZIP do XSD contra o manifesto
        run: bash tools/ci/zip_xsd.sh "$RUNNER_TEMP/xsd-cache"

      - name: ZIP do XSD como artefato para o job banco (retenção de 1 dia)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notalivre-xsd-zip
          path: ${{ runner.temp }}/xsd-cache/esquemas-xsd-producao-restrita-20261124.zip
          retention-days: 1
          if-no-files-found: error

  nativo:
    name: nativo (${{ matrix.distro }})
    needs: qt-cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora45
            imagem: fedora@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
          - distro: ubuntu26.04
            imagem: ubuntu@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
          - distro: manjaro
            imagem: manjarolinux/base@sha256:bbf1f1d746f28e138eea610e140d2f28cbb5b7c5da2fbff034b883527aa604e9
          - distro: mint22.3
            imagem: linuxmintd/mint22.3-amd64@sha256:304bbf7ec2a61252962c5210467d231a141661490e8962f52fd4df7688370369
    container:
      image: ${{ matrix.imagem }}
    defaults:
      run:
        shell: bash

    steps:
      # A imagem ubuntu26.04 não traz git. Sem .git, o actions/checkout baixa pela API (log do run 41176856725:
      # "The repository will be downloaded using the GitHub REST API"). Por isso, só nesta distro, o primeiro checkout sai
      # sem histórico, o script de instalação (que já traz git e ca-certificates, tools/conteiner/instalar/ubuntu26.04.sh)
      # roda, e só então o checkout com histórico completo. NL-2.15 (DA-2.65): a instalação de pacotes desta distro fica só
      # no script de tools/conteiner/instalar, uma só fonte de pacotes (L-51). As outras três distros seguem com um checkout só.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.distro == 'ubuntu26.04'

      - name: "Git e ferramentas de build (só ubuntu26.04: script de instalação, antes do checkout com histórico)"
        if: matrix.distro == 'ubuntu26.04'
        run: |
          bash tools/conteiner/instalar/ubuntu26.04.sh
          echo "/opt/aqt/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # NL-2.14 (DA-2.63, R5-3): histórico inteiro para o merge-base com a onda-2 no resumo do job

      - name: Ferramentas de build (mesmo script do Dockerfile)
        if: matrix.distro != 'ubuntu26.04'
        run: |
          bash tools/conteiner/instalar/${{ matrix.distro }}.sh
          echo "/opt/aqt/bin" >> "$GITHUB_PATH"

      - name: "Prefixo do Connector/C (fonte única: prefixo_mariadb.txt)"
        run: . tools/conteiner/prefixo_mariadb.sh && p="$(nl_prefixo_mariadb "${{ matrix.distro }}")" && echo "NL_MARIADB_PREFIX=$p" >> "$GITHUB_ENV"

      - name: Caminho do Qt 6.12 (fixo por RUNNER_TEMP, o mesmo que o cache usa)
        run: |
          echo "QT_PREFIXO=$RUNNER_TEMP/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"

      - name: Cache do Qt 6.12 (populado pelo job qt-cache; falha se faltar)
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt
          key: qt-6.12.0-linux_gcc_64-qtnetworkauth-qthttpserver-qtimageformats-qtshadertools-qtwebsockets-v1
          fail-on-cache-miss: true

      - name: Tabela de versões e pré-cheque do Qt
        env:
          NL_DISTRO: ${{ matrix.distro }}
        run: |
          bash tools/conteiner/medir_versoes.sh --markdown >> "$GITHUB_STEP_SUMMARY"
          bash tools/conteiner/precheque_qt.sh

      # NL-1.6c: o ZIP do XSD vem do cache (chave = SHA-256) ou, na falta, do gov.br com nova tentativa.
      # Antes do configure, o SHA-256 é conferido com sha256sum -c; divergência derruba o passo e o configure não roda.
      # Download por cmake -P (tools/ci/baixar_zip_xsd.cmake): cmake está nas quatro imagens; sem curl (ubuntu26.04 e mint22.3 não trazem).
      - name: Cache do ZIP do XSD (chave pelo SHA-256)
        id: xsd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xsd-cache
          key: xsd-prodrest-20261124-1ca83c1a7929f6d5684c9a17700fe3d3a375e4ea12b7ccb832bfc369768902c0

      - name: ZIP do XSD (cache ou download com nova tentativa; SHA-256 conferido)
        id: xsd
        run: |
          set -eu
          zip_nome=esquemas-xsd-producao-restrita-20261124.zip
          pasta="$RUNNER_TEMP/xsd-cache"
          zip="$pasta/$zip_nome"
          mkdir -p "$pasta"
          # Cache e código têm de falar do mesmo ZIP: o SHA-256 do passo tem de ser o do manifesto da árvore.
          grep -q -F "# ZIP SHA-256: $NL_XSD_ZIP_SHA256 " third_party/nfse-xsd/prodrest-20261124/SHA256SUMS
          if [ -f "$zip" ]; then
              echo "ZIP do XSD: cache hit ($zip)"
          else
              echo "ZIP do XSD: cache miss, baixando de $NL_XSD_ZIP_URL e, se falhar, do espelho $NL_XSD_ZIP_ESPELHO"
              # cmake -P (file(DOWNLOAD), 5 tentativas por URL, SHA-256 conferido depois): o urllib do Python levou 403 do gov.br.
              if ! cmake -DNL_URLS="$NL_XSD_ZIP_URL;$NL_XSD_ZIP_ESPELHO" -DNL_DESTINO="$zip" -DNL_SHA256="$NL_XSD_ZIP_SHA256" -P tools/ci/baixar_zip_xsd.cmake; then
                  rm -f "$zip"
                  echo "::error::ZIP do XSD não baixado (gov.br e espelho, 5 tentativas cada, ou hash divergente)"
                  exit 1
              fi
          fi
          # Conferência ANTES do configure (L-36): divergência apaga o ZIP e derruba o passo.
          if ! (cd "$pasta" && echo "$NL_XSD_ZIP_SHA256  $zip_nome" | sha256sum -c -); then
              rm -f "$zip"
              echo "::error::SHA-256 do ZIP do XSD divergente do esperado ($NL_XSD_ZIP_SHA256); cache ou download corrompido. Chave do cache não pode ser sobrescrita: trocar a chave."
              exit 1
          fi
          # Exportado para o configure e para o configure aninhado do sabotar_sanidade.sh (CMakeLists lê o ambiente).
          echo "NL_XSD_ZIP_CACHE=$pasta" >> "$GITHUB_ENV"

      - name: Configure (preset debug)
        id: configure
        run: cmake --preset debug

      # Rodada 5 (CI da onda-2, run 40804430962): a trava de piso só conta depois de provada vermelha (L-36). O autoteste
      # reprova o próprio checker quando ele falta ou quando um caso não bate. O piso é o número verde do nativo.
      - name: Autoteste do piso de testes (rodada 5)
        id: piso_autoteste
        run: bash tools/conteiner/autoteste_piso_testes.sh

      - name: Piso de testes e NL_FLATPAK_BUILD OFF (rodada 5)
        id: piso
        run: bash tools/conteiner/piso_testes.sh verificar "$NL_TMP_BASE/notalivre-build/debug" "$(cat tools/conteiner/piso_testes.txt)"

      - name: Build (preset debug)
        id: build
        run: cmake --build --preset debug

      - name: ctest (preset debug)
        id: ctest
        run: ctest --preset debug --output-on-failure --no-tests=error

      # NL-2.14 (DA-2.61): o pulo sai do junitxml por função, comparado por igualdade exata com tests/pulos_esperados_por_distro.txt
      # para esta distro. Roda mesmo com ctest vermelho, para o log trazer as três contagens. NL_DISTRO vazio reprova.
      - name: "Pulos de teste por função (NL-2.14, DA-2.61)"
        id: pulos
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        env:
          NL_DISTRO: ${{ matrix.distro }}
          NL_BASE_REF: origin/onda-2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          sh tools/portoes/pulos_testes.sh "$NL_TMP_BASE/notalivre-build/debug" "$NL_DISTRO" tests/pulos_esperados_por_distro.txt

      # NL-2.15 (DA-2.65): testes registrados no nativo e ausentes no build Flatpak têm de estar em flatpak/testes_fora_do_flatpak.txt,
      # por igualdade exata. Roda com ctest ou pulos vermelhos para o log trazer as contagens; reprova o job.
      - name: "Testes fora do Flatpak, por igualdade exata (NL-2.15, DA-2.65)"
        id: fora
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        run: sh tools/portoes/fora_do_flatpak.sh "$NL_TMP_BASE/notalivre-build/debug" flatpak/testes_fora_do_flatpak.txt

      # NL-2.20 (S2): toda função declarada num programa que o CTest chama por função está registrada, salvo exceção
      # listada em tests/funcoes_fora_do_ctest.txt. Roda com ctest vermelho, para o log trazer as contagens.
      - name: "Funções declaradas e registradas no CTest (NL-2.20)"
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        run: python3 -I tools/portoes/funcoes_no_ctest.py --raiz . --build "$NL_TMP_BASE/notalivre-build/debug" --excecoes tests/funcoes_fora_do_ctest.txt

      # NL-2.14 (DA-2.63, R5-3): diff das listas e contagens contra o merge-base com a onda-2, no resumo do job. O checkout acima
      # traz o histórico inteiro (fetch-depth 0); NL_BASE_REF aponta para o ref da onda-2 que esse checkout baixa.
      - name: "Diff das listas e contagens contra a onda-2 (NL-2.14, DA-2.63 R5-3)"
        if: ${{ always() }}
        env:
          NL_BASE_REF: origin/onda-2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          sh tools/portoes/resumo_listas.sh .

      # DA-2.60 (item 2, NL-2.11): mutante CERT_OPTIONAL no servidor falso, em onda-*, main e PR (não em fatia/*). Roda numa cópia do SHA fora do
      # workspace; o slot transporte.semCertificadoDeClienteHandshakeRecusado tem de morrer. A contagem vai para o resumo
      # deste job (o job mutacao tem o próprio resumo).
      - name: Mutante CERT_OPTIONAL no servidor falso (DA-2.60, cópia fora do workspace)
        id: mutante_mtls
        if: matrix.distro == 'ubuntu26.04'
        run: |
          # Run 41179570887: "fatal: detected dubious ownership in repository". O .git é do usuário do runner, e este passo
          # roda como outro usuário no contêiner. Confiança declarada só para este caminho, no mesmo padrão dos portões.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/mutacao/mutante_mtls.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$RUNNER_TEMP/mutante-mtls"

      # A0-05 (L-36): o build nativo tem de REPROVAR uma sabotagem do próprio tst_sanidade, pelo motivo esperado.
      # Roda no mesmo contêiner, sobre uma cópia em NL_TMP_BASE. Este step passa só se a sabotagem reprovar.
      - name: Sabotagem de estreia do tst_sanidade (deve reprovar)
        id: sabotagem_sanidade
        run: bash tools/conteiner/sabotar_sanidade.sh

      - name: Resumo do build e do ctest
        if: always()
        run: |
          {
            echo "## Build e ctest: ${{ matrix.distro }}"
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| ZIP do XSD (cache ou download, SHA-256 conferido) | ${{ steps.xsd.outcome }} |"
            echo "| Configure (debug) | ${{ steps.configure.outcome }} |"
            echo "| Build (debug) | ${{ steps.build.outcome }} |"
            echo "| ctest (debug) | ${{ steps.ctest.outcome }} |"
            echo "| Sabotagem do tst_sanidade (deve reprovar) | ${{ steps.sabotagem_sanidade.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # NL-3.0h (ordem do CTO, passo 5): ASan e UBSan em push de onda-* e main e em pull_request, nas distros fedora45 e mint22.3.
  # Não é falta de libasan: o preset roda também em ubuntu26.04 e manjaro (NL-3.2c). ubuntu26.04 fica fora por vazamento em aberto (INBOX).
  # O mint22.3 é o único com cliente HTTP da libxml2 (com_http): o ramo que a causa A do validador XSD exige.
  # NL-3.A (L-36): nenhum teste usa regex de passe (portão codigo_de_saida), então o código 86 do sanitizer reprova todo
  # teste; o texto do relatório reprova também, pelo gate de tests/cmake/nl_registra_teste.cmake: ver TESTES.md (T4).
  asan:
    name: asan (${{ matrix.distro }})
    needs: qt-cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora45
            imagem: fedora@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
          - distro: manjaro
            imagem: manjarolinux/base@sha256:bbf1f1d746f28e138eea610e140d2f28cbb5b7c5da2fbff034b883527aa604e9
          - distro: mint22.3
            imagem: linuxmintd/mint22.3-amd64@sha256:304bbf7ec2a61252962c5210467d231a141661490e8962f52fd4df7688370369
    container:
      image: ${{ matrix.imagem }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ferramentas de build (mesmo script do Dockerfile)
        run: |
          bash tools/conteiner/instalar/${{ matrix.distro }}.sh
          echo "/opt/aqt/bin" >> "$GITHUB_PATH"

      - name: "Prefixo do Connector/C (fonte única: prefixo_mariadb.txt)"
        run: . tools/conteiner/prefixo_mariadb.sh && p="$(nl_prefixo_mariadb "${{ matrix.distro }}")" && echo "NL_MARIADB_PREFIX=$p" >> "$GITHUB_ENV"

      - name: Caminho do Qt 6.12 (fixo por RUNNER_TEMP, o mesmo que o cache usa)
        run: |
          echo "QT_PREFIXO=$RUNNER_TEMP/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"

      - name: Cache do Qt 6.12 (populado pelo job qt-cache; falha se faltar)
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt
          key: qt-6.12.0-linux_gcc_64-qtnetworkauth-qthttpserver-qtimageformats-qtshadertools-qtwebsockets-v1
          fail-on-cache-miss: true

      - name: Tabela de versões e pré-cheque do Qt
        env:
          NL_DISTRO: ${{ matrix.distro }}
        run: |
          bash tools/conteiner/medir_versoes.sh --markdown >> "$GITHUB_STEP_SUMMARY"
          bash tools/conteiner/precheque_qt.sh

      # NL-1.6c: o ZIP do XSD vem do cache (chave = SHA-256) ou, na falta, do gov.br com nova tentativa.
      # Antes do configure, o SHA-256 é conferido com sha256sum -c; divergência derruba o passo e o configure não roda.
      # Download por cmake -P (tools/ci/baixar_zip_xsd.cmake): cmake está nas quatro imagens; sem curl (ubuntu26.04 e mint22.3 não trazem).
      - name: Cache do ZIP do XSD (chave pelo SHA-256)
        id: xsd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xsd-cache
          key: xsd-prodrest-20261124-1ca83c1a7929f6d5684c9a17700fe3d3a375e4ea12b7ccb832bfc369768902c0

      - name: ZIP do XSD (cache ou download com nova tentativa; SHA-256 conferido)
        id: xsd
        run: |
          set -eu
          zip_nome=esquemas-xsd-producao-restrita-20261124.zip
          pasta="$RUNNER_TEMP/xsd-cache"
          zip="$pasta/$zip_nome"
          mkdir -p "$pasta"
          # Cache e código têm de falar do mesmo ZIP: o SHA-256 do passo tem de ser o do manifesto da árvore.
          grep -q -F "# ZIP SHA-256: $NL_XSD_ZIP_SHA256 " third_party/nfse-xsd/prodrest-20261124/SHA256SUMS
          if [ -f "$zip" ]; then
              echo "ZIP do XSD: cache hit ($zip)"
          else
              echo "ZIP do XSD: cache miss, baixando de $NL_XSD_ZIP_URL e, se falhar, do espelho $NL_XSD_ZIP_ESPELHO"
              # cmake -P (file(DOWNLOAD), 5 tentativas por URL, SHA-256 conferido depois): o urllib do Python levou 403 do gov.br.
              if ! cmake -DNL_URLS="$NL_XSD_ZIP_URL;$NL_XSD_ZIP_ESPELHO" -DNL_DESTINO="$zip" -DNL_SHA256="$NL_XSD_ZIP_SHA256" -P tools/ci/baixar_zip_xsd.cmake; then
                  rm -f "$zip"
                  echo "::error::ZIP do XSD não baixado (gov.br e espelho, 5 tentativas cada, ou hash divergente)"
                  exit 1
              fi
          fi
          # Conferência ANTES do configure (L-36): divergência apaga o ZIP e derruba o passo.
          if ! (cd "$pasta" && echo "$NL_XSD_ZIP_SHA256  $zip_nome" | sha256sum -c -); then
              rm -f "$zip"
              echo "::error::SHA-256 do ZIP do XSD divergente do esperado ($NL_XSD_ZIP_SHA256); cache ou download corrompido. Chave do cache não pode ser sobrescrita: trocar a chave."
              exit 1
          fi
          # Exportado para o configure e para o configure aninhado do sabotar_sanidade.sh (CMakeLists lê o ambiente).
          echo "NL_XSD_ZIP_CACHE=$pasta" >> "$GITHUB_ENV"

      - name: Configure (preset asan-ubsan)
        run: cmake --preset asan-ubsan

      - name: Build (preset asan-ubsan)
        run: cmake --build --preset asan-ubsan

      # NL-3.0h (L-36): prova pelo binário e pelo canário que o sanitizer e o gate estão ativos (TESTES.md, T4).
      - name: Sanitizer ativo e gate aplicado (portão sanitizer_ativo, NL-3.0h)
        run: python3 -I tools/portoes/sanitizer_ativo.py "$NL_TMP_BASE/notalivre-build/asan-ubsan" CMakePresets.json

      - name: ctest (preset asan-ubsan)
        id: ctest_asan
        run: ctest --preset asan-ubsan --output-on-failure --no-tests=error

      # NL-3.A (L-17, L-36): o mesmo portão de pulos do job nativo e do contêiner local (executar_no_conteiner.sh). Sem regex
      # de passe, o pulo e a contagem exata de funções do build asan são conferidos aqui, pelo junitxml.
      - name: "Pulos de teste por função, preset asan-ubsan (NL-2.14, NL-3.A)"
        if: ${{ always() && steps.ctest_asan.outcome != 'skipped' }}
        env:
          NL_DISTRO: ${{ matrix.distro }}
          NL_BASE_REF: origin/onda-2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          sh tools/portoes/pulos_testes.sh "$NL_TMP_BASE/notalivre-build/asan-ubsan" "$NL_DISTRO" tests/pulos_esperados_por_distro.txt

      # NL-2.20 (S2): toda função declarada num programa que o CTest chama por função está registrada, salvo exceção
      # listada em tests/funcoes_fora_do_ctest.txt. Roda com ctest vermelho, para o log trazer as contagens.
      - name: "Funções declaradas e registradas no CTest, preset asan-ubsan (NL-2.20)"
        if: ${{ always() && steps.ctest_asan.outcome != 'skipped' }}
        run: python3 -I tools/portoes/funcoes_no_ctest.py --raiz . --build "$NL_TMP_BASE/notalivre-build/asan-ubsan" --excecoes tests/funcoes_fora_do_ctest.txt

  # NL-3.1v (decisões do líder de 27/11/2026: "Fazer o job de banco no CI (Recomendado)" e, na matriz, "16 pares em todo
  # push (Recomendado)"). Um job por distro roda todos os pares dela em tools/conteiner/matriz_banco.txt pelo mesmo
  # tools/conteiner/integracao_banco.sh do caso local, sem services (ordem do CTO de 04/11/2026, seção 4.2). Roda no host
  # do runner, como higiene e mutacao: servidor e executor sobem por docker na rede do servidor, e o harness monta caminho
  # de host. Build e harness rodam como o usuário de uid 1000 (os contêineres rodam como 1000:1000 e a credencial nasce
  # 0700), na trava do CI (tools/ci/pesado_ci.sh, pelo NL_PESADO). Nenhum script do caso local muda. Plano do CTO da NL-3.1v.
  banco:
    name: banco (${{ matrix.distro }})
    needs: [qt-cache-host, xsd-cache]
    runs-on: ubuntu-latest
    # Tetos da trava: 15 (imagem) + 30 (build) + 50 (harness) = 95 min; os outros passos (caches, Qt no volume, servidores,
    # imagem de higiene) somam cerca de 10 min; 120 deixa uns 15 min de folga. O primeiro run verde mede o real.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Piso fixado aqui, fora de matriz_banco.txt e do CMake (revisão de segurança do 65952ef, achado 2): pares por distro e
      # slots por par. Mudar a matriz ou os testes do banco exige mudar este piso no mesmo diff, à vista na revisão.
      matrix:
        include:
          - distro: fedora45
            pares: 7
            slots: 43
          - distro: ubuntu26.04
            pares: 2
            slots: 43
          - distro: manjaro
            pares: 3
            slots: 43
          - distro: mint22.3
            pares: 4
            slots: 43
    env:
      NL_SHA: ${{ github.sha }}
      NL_FATIA: ci-banco-${{ matrix.distro }}
      NL_CI_DISTRO: ${{ matrix.distro }}
      NL_CI_PISO_PARES: ${{ matrix.pares }}
      NL_CI_SLOTS: ${{ matrix.slots }}
      NL_PESADO: ${{ github.workspace }}/tools/ci/pesado_ci.sh
      # Variáveis que passam pelo sudo ao usuário de uid 1000 (o sudo zera o ambiente).
      NL_SUDO_ENV: NL_PESADO,NL_PESADO_TETO,NL_SHA,NL_FATIA,NL_TMP_BASE,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_TEMP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # os portões estáticos do build_local.sh clonam o SHA com histórico (portoes_estaticos.sh)
          persist-credentials: false   # nenhum passo fala com o GitHub; o token não fica no .git que o uid 1000 lê

      # Mede o que o plano não mediu: uid do runner, uid 1000 livre ou não, CPUs, memória e disco.
      - name: Ambiente do runner (começo)
        run: |
          {
            echo "### Ambiente do runner, começo ($NL_CI_DISTRO)"
            echo '```'
            id
            getent passwd 1000 || echo "uid 1000: livre"
            echo "nproc --all: $(nproc --all)"
            free -m
            df -h /
            docker system df
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Chave do host (job qt-cache-host): o cache do qt-cache, gravado em contêiner, não casa aqui (run 45984901232).
      - name: Cache do Qt 6.12 (populado pelo job qt-cache-host; falha se faltar)
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt
          key: qt-6.12.0-linux_gcc_64-qtnetworkauth-qthttpserver-qtimageformats-qtshadertools-qtwebsockets-v1-host-v1
          fail-on-cache-miss: true

      # O build do banco roda com --network none e lê o ZIP de NL_TMP_BASE/notalivre-xsd-cache (padrão do build_local.sh).
      # O ZIP vem do job xsd-cache por artefato (run 45985663535: cache de host em miss e gov.br com "SSL connect error").
      - name: ZIP do XSD do job xsd-cache (artefato; falha se faltar)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notalivre-xsd-zip
          path: ${{ env.NL_TMP_BASE }}/notalivre-xsd-cache

      - name: ZIP do XSD conferido de novo antes do build (SHA-256 do manifesto; sem download)
        id: xsd
        run: bash tools/ci/zip_xsd.sh "$NL_TMP_BASE/notalivre-xsd-cache"

      - name: Usuário de uid 1000 (os contêineres do build e do harness rodam como 1000:1000)
        id: usuario
        run: |
          u="$(bash tools/ci/banco/usuario_1000.sh "$GITHUB_WORKSPACE")"
          echo "NL_CI_USUARIO=$u" >> "$GITHUB_ENV"

      - name: Imagem de build da distro (build_local.sh imagem, como o uid 1000)
        id: imagem
        env:
          NL_PESADO_TETO: "15"
        run: |
          set +e
          sudo -n -H -u "$NL_CI_USUARIO" --preserve-env="$NL_SUDO_ENV" bash tools/conteiner/build_local.sh imagem "$NL_CI_DISTRO"
          rc=$?
          sudo -n -u "$NL_CI_USUARIO" cat "$NL_TMP_BASE/notalivre-logs/NL-2.0-imagem-$NL_CI_DISTRO.log"
          exit "$rc"

      - name: Imagem de higiene (mesma do job higiene; os portões estáticos do build_local.sh a usam)
        run: docker build -t notalivre-higiene:ci -f tools/portoes/higiene.Dockerfile tools/portoes

      - name: Qt 6.12 do cache no volume notalivre-qt-6120
        run: bash tools/ci/banco/volume_qt.sh "$NL_CI_DISTRO" "$RUNNER_TEMP/qt"

      - name: Servidores de banco dos pares da distro, por digest (servidores_banco.txt)
        run: bash tools/ci/banco/puxar_servidores.sh "$NL_CI_DISTRO"

      - name: Build do preset banco (build_local.sh, como o uid 1000)
        id: build
        env:
          NL_PESADO_TETO: "30"
        run: |
          set +e
          sudo -n -H -u "$NL_CI_USUARIO" --preserve-env="$NL_SUDO_ENV" bash tools/conteiner/build_local.sh "$NL_CI_DISTRO" banco
          rc=$?
          sudo -n -u "$NL_CI_USUARIO" cat "$NL_TMP_BASE/notalivre-logs/NL-0.4-$NL_CI_DISTRO-banco.log"
          exit "$rc"

      # O rc do harness é o rc do passo (NL-RC). O log fica em RUNNER_TEMP para o resumo e o fim dos logs de par.
      - name: Harness do banco, todos os pares da distro (integracao_banco.sh, como o uid 1000)
        id: harness
        env:
          NL_PESADO_TETO: "50"
        run: |
          set +e
          sudo -n -H -u "$NL_CI_USUARIO" --preserve-env="$NL_SUDO_ENV" bash tools/conteiner/integracao_banco.sh "$NL_CI_DISTRO" todos > "$RUNNER_TEMP/banco-$NL_CI_DISTRO.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/banco-$NL_CI_DISTRO.log"
          exit "$rc"

      - name: Fim do log de cada par vermelho (nenhum, se o harness acusou senha em log)
        if: ${{ always() && steps.harness.outcome == 'failure' }}
        run: bash tools/ci/banco/logs_dos_pares.sh "$RUNNER_TEMP/banco-$NL_CI_DISTRO.log" "$NL_CI_DISTRO" "$NL_SHA" "$NL_CI_USUARIO"

      - name: Resumo do banco (reprova sem NL-BANCO-RESUMO, ou com pares ou slots abaixo do piso do ci.yml)
        id: resumo
        if: always()
        run: bash tools/ci/banco/resumo.sh "$RUNNER_TEMP/banco-$NL_CI_DISTRO.log" "$NL_CI_DISTRO" "$NL_CI_PISO_PARES" "$NL_CI_SLOTS"

      - name: Ambiente do runner (fim)
        if: always()
        run: |
          {
            echo "### Ambiente do runner, fim ($NL_CI_DISTRO)"
            echo '```'
            id "${NL_CI_USUARIO:-1000}" || echo "uid 1000: não preparado"
            free -m
            df -h /
            docker system df
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  higiene:
    name: higiene (segredos e travessão)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # histórico inteiro, obrigatório para o modo git do gitleaks (L-28)

      - name: Workspace seguro para o git do host
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Construir imagem de higiene
        run: docker build -t notalivre-higiene:ci -f tools/portoes/higiene.Dockerfile tools/portoes

      - name: Segredos no histórico (gitleaks git)
        id: segredos_historico
        # O contêiner roda como root sobre um workspace de outro dono (L-49): o safe.directory vai dentro dele.
        # NL-3.E: o portão tem piso (zero commit lido reprova); o autoteste dele roda logo abaixo.
        run: |
          docker run --pull=never --rm -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            sh -c 'git config --global --add safe.directory /src && sh /src/tools/portoes/higiene_historico.sh /src'

      - name: Autoteste do portão de histórico (piso de commits, NL-3.E)
        id: autoteste_historico
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            sh -c 'git config --global --add safe.directory /src && bash /src/tools/portoes/autoteste_historico.sh'

      - name: Segredos na árvore (gitleaks dir)
        id: segredos_arvore
        run: |
          docker run --pull=never --rm -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            bash /src/tools/portoes/higiene_segredos.sh /src

      - name: Travessão e meia-risca (UI e docs)
        id: travessao
        run: |
          docker run --pull=never --rm -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            python3 -I /src/tools/portoes/higiene_travessao.py /src

      - name: Cabeçalho SPDX (portão e autoteste, A0-06)
        id: spdx
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            sh -c 'git config --global --add safe.directory /src && python3 -I /src/tools/portoes/spdx.py /src && bash /src/tools/portoes/autoteste_spdx.sh'

      # NL-2.1 (L-36): o autoteste dos portões roda no CI (inclui o teste de chave privada commitada, S8).
      - name: Autoteste dos portões de higiene (A0-06 e NL-2.1)
        id: autoteste_higiene
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            sh -c 'git config --global --add safe.directory /src && bash /src/tools/portoes/autoteste_higiene.sh'

      # NL-3.0g: distro aposentada fora das exceções e digest fedora@sha256 único (portão distro_base, com autoteste).
      - name: Distro base e digest único (portão distro_base, NL-3.0g)
        id: distro_base
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            sh -c 'git config --global --add safe.directory /src && python3 -I /src/tools/portoes/distro_base.py /src && python3 -I /src/tools/portoes/distro_base.py --autoteste'

      # NL-3.0h: o portão sanitizer_ativo está ligado, o ambiente do preset é o fixado e ninguém desliga o sanitizer.
      - name: Sanitizer ligado e sem desligamento (portão sanitizer_ligado, NL-3.0h)
        id: sanitizer_ligado
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            sh -c 'git config --global --add safe.directory /src && python3 -I /src/tools/portoes/sanitizer_ligado.py /src && python3 -I /src/tools/portoes/sanitizer_ligado.py --autoteste'

      # NL-3.A (L-36): nenhum teste decide pelo regex de passe, por WILL_FAIL ou por SKIP_*; o código de saída decide.
      - name: Código de saída decide os testes (portão codigo_de_saida, NL-3.A)
        id: codigo_de_saida
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            sh -c 'git config --global --add safe.directory /src && python3 -I /src/tools/portoes/codigo_de_saida.py /src'

      # NL-1.8 (L-36): hexadecimal de cor só em apps/gui/qml/Theme.qml; o tema gerado tem de bater com a spec visual.
      - name: Hexadecimal só no Theme (portão nenhum_hex_fora_do_theme)
        id: hex
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            python3 -I /src/tools/portoes/nenhum_hex_fora_do_theme.py /src

      - name: Tema gerado bate com a spec visual (gerar_theme --verificar, seção 3.4)
        id: tema
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            python3 -I /src/tools/tema/gerar_theme.py --raiz /src --verificar

      # NL-2.6 (DA-2.10, ADR 0007): a variável de SHA-1 só pode aparecer no arnês de teste do fedora45.
      - name: Variável de SHA-1 fora do arnês fedora45 (portao_sha1_env)
        id: sha1_env
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            python3 -I /src/tools/portoes/portao_sha1_env.py /src

      # NL-2.21 (DA-2.67): pontos de parse da libxml2 só nos átomos listados em tools/portoes/pontos_de_parse.txt.
      - name: Pontos de parse da libxml2 (portão pontos_de_parse, NL-2.21)
        id: pontos_parse
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            python3 -I /src/tools/portoes/pontos_de_parse.py /src

      # NL-3.1a (CISO, parecer R1; decisão do líder de 21/11/2026, "Pôr no CI antes"): o portão sql_seguro e o seu
      # autoteste rodam no CI com a mesma forma da lista de portões (lista_portoes.txt, linha sql_seguro).
      - name: Portão sql_seguro (regras S1 a S8 do executor SQL, NL-3.1a)
        id: sql_seguro
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            sh -c 'git config --global --add safe.directory /src && python3 -I /src/tools/portoes/sql_seguro.py /src'

      - name: Autoteste do portão sql_seguro (casos de sabotagem, NL-3.1a)
        id: autoteste_sql_seguro
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            sh -c 'git config --global --add safe.directory /src && bash /src/tools/portoes/autoteste_sql_seguro.sh /src'

      - name: Fixação do CI (digest, SHA e privilégio; ADR 0001, A0-07)
        id: fixacao
        run: |
          docker run --pull=never --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" notalivre-higiene:ci \
            sh -c 'python3 -I /src/tools/portoes/fixacao_ci.py /src && python3 -I /src/tools/portoes/fixacao_ci.py --autoteste'

      - name: Resumo da higiene
        if: always()
        run: |
          {
            echo "## Higiene (NL-0.6)"
            echo "| Portão | Resultado |"
            echo "| --- | --- |"
            echo "| Segredos no histórico (gitleaks git) | ${{ steps.segredos_historico.outcome }} |"
            echo "| Autoteste do portão de histórico (piso, clone raso e rc) | ${{ steps.autoteste_historico.outcome }} |"
            echo "| Segredos na árvore (gitleaks dir) | ${{ steps.segredos_arvore.outcome }} |"
            echo "| Travessão e meia-risca | ${{ steps.travessao.outcome }} |"
            echo "| Cabeçalho SPDX (portão e autoteste) | ${{ steps.spdx.outcome }} |"
            echo "| Hexadecimal só no Theme (nenhum_hex_fora_do_theme) | ${{ steps.hex.outcome }} |"
            echo "| Tema gerado bate com a spec visual (gerar_theme --verificar) | ${{ steps.tema.outcome }} |"
            echo "| Variável de SHA-1 fora do arnês fedora45 (portao_sha1_env) | ${{ steps.sha1_env.outcome }} |"
            echo "| Fixação do CI (digest, SHA e privilégio) | ${{ steps.fixacao.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  camadas:
    name: camadas (portão A2 e autoteste)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Portão de camadas (camadas.py)
        id: camadas
        run: |
          set +e
          python3 -I tools/portoes/camadas.py "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/camadas.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/camadas.log"
          { echo "## Camadas (NL-0.3)"; echo '```'; tail -n 3 "$RUNNER_TEMP/camadas.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Autoteste do portão de camadas (controles e sabotagem)
        id: autoteste
        run: |
          set +e
          bash tools/portoes/autoteste_camadas.sh > "$RUNNER_TEMP/autoteste.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/autoteste.log"
          { echo "## Autoteste de camadas"; echo '```'; tail -n 3 "$RUNNER_TEMP/autoteste.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # Autotestes de estreia da NL-2.11 (DA-2.61; L-36): só shell, sem contêiner. Um trava nova só vale com autoteste que roda.
  # O autoteste de limites usa um docker de mentira no PATH, por isso roda no runner e não num contêiner.
  autotestes:
    name: autotestes (piso dos portões, suíte Flatpak, limites de contêiner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Piso dos portões confere com a lista do commit (NL-3.0g, A1 do CTO)"
        run: |
          n=$(grep -vc '^#' tools/conteiner/lista_portoes.txt)
          p=$(sed -n 1p tools/conteiner/piso_portoes.txt)
          echo "piso=$p lista=$n"
          [ "$n" = "$p" ]

      - name: Autoteste do piso dos portões (NL-2.11, A1)
        run: bash tools/conteiner/autoteste_piso_portoes.sh

      - name: Autoteste da suíte Flatpak (NL-2.11, A4 e A9)
        run: bash flatpak/autoteste_suite_flatpak.sh

      - name: Autoteste dos limites de contêiner (NL-2.11, A2 e A3)
        run: bash tools/conteiner/autoteste_build_limites.sh

      - name: Autoteste dos limites de contêiner dos portões estáticos (NL-2.11, NL-3.K)
        run: bash tools/conteiner/autoteste_portoes_limites.sh

      # NL-3.0j (CTO, 10/11/2026): arnês de repetição. Cotas do modo ensaio e do mutante, listas inválidas e o corpo do ensaio com ctest de mentira.
      - name: "Autoteste do arnês de repetição, modo ensaio e corpo (NL-3.0j)"
        run: bash tools/conteiner/autoteste_build_ensaio.sh

      - name: "Autoteste do portão de pulos (NL-2.14, DA-2.61)"
        run: bash tools/portoes/autoteste_pulos_testes.sh

      - name: "Autoteste do portão fora do Flatpak (NL-2.15, DA-2.65)"
        run: bash tools/portoes/autoteste_fora_do_flatpak.sh

      - name: "Autoteste do portão de funções no CTest (NL-2.20)"
        run: bash tools/portoes/autoteste_funcoes_no_ctest.sh

      - name: "Autoteste do portão de pontos de parse (NL-2.21, DA-2.67)"
        run: bash tools/portoes/autoteste_pontos_de_parse.sh

      - name: "Autoteste dos cabeçalhos do libsodium (NL-3.2a)"
        run: bash tools/conteiner/autoteste_cabecalhos_sodium.sh

      - name: "Autoteste dos cabeçalhos do OpenSSL (NL-2.2)"
        run: bash tools/conteiner/autoteste_cabecalhos_openssl.sh

      - name: "Autoteste de build e evidência por SHA (NL-2.0, C10 e C11, NL-3.0g)"
        run: bash tools/conteiner/autoteste_build_sha.sh

      - name: "Autoteste do V-a do banco, harness contra servidor de banco (NL-3.1h, passo 11)"
        run: bash tools/conteiner/autoteste_integracao_banco.sh

      - name: "Autoteste da cópia do espelho, área privada (NL-3.E e NL-3.0g)"
        run: bash tools/espelho/autoteste_copiar_arvore.sh

      - name: "Autoteste do executor do espelho, conferência na área própria (NL-3.0g, achado 1)"
        run: bash tools/espelho/autoteste_rodar_espelho.sh

      - name: "Autoteste de --pull=never nas chamadas docker run (NL-3.0g, L-17)"
        run: bash tools/espelho/autoteste_pull_never.sh "$GITHUB_WORKSPACE"

      - name: "Autoteste do portão de sanitizer ativo (NL-3.0h)"
        run: bash tools/portoes/autoteste_sanitizer_ativo.sh

      - name: "Autoteste do portão do código de saída (NL-3.A)"
        run: bash tools/portoes/autoteste_codigo_de_saida.sh

      - name: "Autoteste da cota de núcleos do espelho e do build (NL-3.0k)"
        run: bash tools/espelho/autoteste_cota_nucleos.sh

      - name: "Autoteste do teto de contêiner, átomo (NL-3.K)"
        run: bash tools/conteiner/autoteste_cota_conteiner.sh

      - name: "Teto em todo contêiner, casos e varredura (NL-3.K)"
        run: bash tools/portoes/autoteste_cota_em_todo_conteiner.sh "$GITHUB_WORKSPACE"

      - name: "Teto de processos em todo docker run, casos e varredura (NL-3.1h, v3.11)"
        run: bash tools/portoes/autoteste_pids_em_docker_run.sh "$GITHUB_WORKSPACE"

      # NL-3.0i (revisão de edc4cde): o --ensaio do emitir_teste.sh roda no CI, com HOME descartável. Depende de bash,
      # python3 (já usado por este job em outros passos), sha256sum, stat e coreutils, todos no runner ubuntu-latest.
      - name: "Ensaio do emitir_teste.sh, contador durável e casos de revisão (NL-3.0i)"
        run: |
          mkdir -p "$RUNNER_TEMP/home-ensaio"
          HOME="$RUNNER_TEMP/home-ensaio" bash tools/producao_restrita/emitir_teste.sh --ensaio

  # Build Flatpak contra o SDK KDE 6.11 (NL-0.5). Portão ATIVO desde a NL-0.5: o plano exige o build a cada fatia,
  # e a API exclusiva do Qt 6.12 tem de quebrá-lo (ver o job mutacao). O CI nativo continua com Qt 6.12.
  flatpak:
    name: flatpak (build contra SDK KDE 6.11 e bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # Exemplo oficial da action: o builder precisa de --privileged para o bwrap do flatpak-builder (medido na NL-0.5).
    container:
      # Fixada por digest do índice multi-arch (A0-07, R6). Decisão de risco: docs/adr/0001-flatpak-privileged.md.
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
      # NL-3.1a (CI da onda-3, run 44939648309): os runtimes do SDK vêm na camada da imagem, e em parte dos hosts (medido:
      # AWS us-east-1) o overlay do Docker não renomeia diretório dessa camada; a atualização do runtime cai com
      # "Invalid cross-device link". Um volume não é overlay, e o Docker copia para ele o /var/lib/flatpak da imagem.
      volumes:
        - notalivre-flatpak:/var/lib/flatpak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reserva do ZIP do XSD (decisão do líder, "Cópia no CI + reserva (Recomendado)"): o gov.br caiu três vezes no download
      # feito pelo próprio flatpak-builder. Mesmo cache e mesma chave dos jobs nativos; o ZIP vai para o caminho de checksum
      # do flatpak-builder (.flatpak-builder/downloads/<SHA-256>/<nome>), e o builder não baixa de novo.
      - name: Cache do ZIP do XSD (mesmo cache dos jobs nativos)
        id: xsd-cache-flatpak
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xsd-cache
          key: xsd-prodrest-20261124-1ca83c1a7929f6d5684c9a17700fe3d3a375e4ea12b7ccb832bfc369768902c0

      - name: ZIP do XSD para o flatpak-builder (cache ou download com nova tentativa; SHA-256 conferido)
        id: xsd-flatpak
        run: |
          set -eu
          zip_nome=esquemas-xsd-producao-restrita-20261124.zip
          pasta="$RUNNER_TEMP/xsd-cache"
          zip="$pasta/$zip_nome"
          mkdir -p "$pasta"
          grep -q -F "# ZIP SHA-256: $NL_XSD_ZIP_SHA256 " third_party/nfse-xsd/prodrest-20261124/SHA256SUMS
          if [ -f "$zip" ]; then
              echo "ZIP do XSD (flatpak): cache hit ($zip)"
          else
              echo "ZIP do XSD (flatpak): cache miss, baixando de $NL_XSD_ZIP_URL e, se falhar, do espelho $NL_XSD_ZIP_ESPELHO"
              if ! cmake -DNL_URLS="$NL_XSD_ZIP_URL;$NL_XSD_ZIP_ESPELHO" -DNL_DESTINO="$zip" -DNL_SHA256="$NL_XSD_ZIP_SHA256" -P tools/ci/baixar_zip_xsd.cmake; then
                  echo "::error::ZIP do XSD não baixado (flatpak; gov.br e espelho, 5 tentativas cada, ou hash divergente)"
                  exit 1
              fi
          fi
          # Conferência ANTES de copiar (L-36). Divergência derruba o passo; o cache não é apagado aqui (sem rm com variável).
          if ! (cd "$pasta" && echo "$NL_XSD_ZIP_SHA256  $zip_nome" | sha256sum -c -); then
              echo "::error::SHA-256 do ZIP do XSD divergente no flatpak ($NL_XSD_ZIP_SHA256): trocar a chave do cache"
              exit 1
          fi
          destino="$GITHUB_WORKSPACE/.flatpak-builder/downloads/$NL_XSD_ZIP_SHA256"
          mkdir -p "$destino"
          cp "$zip" "$destino/$zip_nome"
          echo "ZIP do XSD copiado para o caminho de checksum do flatpak-builder: $destino/$zip_nome"

      - name: Build do manifesto e bundle (flatpak-builder)
        id: builder
        # Action fixada pelo commit do tag v6 (flatpak-github-actions). Sem restore-keys na action:
        # o cache só casa com a chave exata, então a chave é estável por manifesto e pelo código do smoke.
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: flatpak/io.github.petrinhu.notalivre.yml
          cache-key: flatpak-builder-kde-6.11-${{ hashFiles('flatpak/io.github.petrinhu.notalivre.yml', 'flatpak/smoke/**') }}
          bundle: notalivre.flatpak
          artifact-name: notalivre-bundle
          # NL-3.2a (revisão A1): os diretórios que a conferência lê. São os padrões da action (index.js:64 e :66), declarados aqui.
          build-dir: flatpak_app
          repo-dir: repo

      # NL-3.2a (revisão A1 e A2): confere o diretório de build e o repositório OSTree do bundle, pelo app, a biblioteca
      # e a licença da libsodium. Só leitura: nada do app é executado. Reprova o job se faltar qualquer um.
      - name: Conferência do bundle e do repositório (NL-3.2a)
        shell: bash
        run: |
          bash tools/conteiner/conferencia_bundle_libs.sh flatpak_app
          bash tools/conteiner/conferencia_repo_flatpak.sh repo

      - name: Resumo do build Flatpak
        if: always()
        run: |
          {
            echo "## Flatpak (NL-0.5): build contra SDK 6.11"
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| Build e bundle (flatpak-builder) | ${{ steps.builder.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Plano B padrão (NL-0.5, D0.5): bundle instalado no host do runner, sem contêiner e sem --privileged.
  # Portão: smoke QML offscreen (Qt 6.11.2), TCP 127.0.0.1 e os-release, todos dentro do sandbox.
  smoke-host:
    name: smoke no host do runner (plano B, sandbox)
    needs: flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # NL-2.27b: sem este checkout, o job não tem os scripts de flatpak/host/ e os passos de medição saem com 127.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notalivre-bundle
          path: ${{ runner.temp }}/bundle

      # Plano B da NL-0.5: o runner instala o Flatpak do sistema para o smoke do bundle. Não é pacote de build de contêiner;
      # fica só neste job de smoke, fora do job nativo (NL-2.15, DA-2.65, emenda 2).
      - name: Instalar flatpak no host
        run: sudo apt-get update && sudo apt-get install -y flatpak

      - name: Runtime KDE 6.11 e bundle (instalação de usuário)
        id: instalar
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Platform//6.11
          flatpak install --user -y --bundle "$RUNNER_TEMP/bundle/notalivre.flatpak"

      - name: Smoke QML offscreen dentro do sandbox
        id: smoke
        run: |
          flatpak run --user --env=QT_QPA_PLATFORM=offscreen --command=notalivre-qml-smoke io.github.petrinhu.notalivre

      - name: TCP 127.0.0.1 dentro do sandbox
        id: tcp
        run: |
          python3 -m http.server --bind 127.0.0.1 47891 > "$RUNNER_TEMP/servidor.log" 2>&1 &
          srv=$!
          # NL-2.27b: sem set +e, o shell do passo (bash -e) encerra antes do cat e o log some quando o teste falha.
          set +e
          flatpak run --user --command=bash io.github.petrinhu.notalivre -c 'for i in $(seq 1 30); do exec 3<>/dev/tcp/127.0.0.1/47891 && break; sleep 0.5; done; printf "GET / HTTP/1.0\r\n\r\n" >&3; head -n 1 <&3' > "$RUNNER_TEMP/tcp.log" 2>&1
          rc=$?
          kill "$srv" 2>/dev/null
          cat "$RUNNER_TEMP/tcp.log"
          test "$rc" -eq 0 && grep -q 'HTTP/1.0 200' "$RUNNER_TEMP/tcp.log"

      - name: os-release visto pelo sandbox
        id: osrelease
        run: flatpak run --user --command=cat io.github.petrinhu.notalivre /run/host/os-release

      # NL-2.10e (E2, DA-2.70): quantas CAs o runtime KDE 6.11 traz dentro do sandbox, e quais raízes ICP-Brasil e a GlobalSign
      # Root R46 estão lá. Só lê o bundle de CAs. Piso zero reprova (L-36).
      - name: CAs do runtime KDE 6.11 dentro do sandbox
        id: cas_runtime
        run: |
          set +e
          bash tools/diagnostico/contar_cas_runtime.sh io.github.petrinhu.notalivre > "$RUNNER_TEMP/cas_runtime.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/cas_runtime.log"
          exit "$rc"

      # NL-2.27 (passo 6, L-36): o medidor da senha por descritor tem de reprovar com os dois flatpaks falsos antes da medição real.
      - name: Autoteste do medidor da senha por descritor
        id: senha_fd_autoteste
        run: |
          # NL-2.27b: sem set +e, o shell do passo (bash -e) encerra antes do cat e o log some quando o autoteste falha.
          set +e
          bash flatpak/host/autoteste_senha_fd.sh > "$RUNNER_TEMP/autoteste_senha_fd.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/autoteste_senha_fd.log"
          exit "$rc"

      # NL-2.27 (passo 6): medição real dentro do sandbox: versão do flatpak, grupos de processo, repasse do fd 3 e CLI sem descritor
      # sob pseudo-terminal. Os números vão para o resumo do job (DA-2.16, DA-2.68).
      - name: Medição da senha por descritor dentro do sandbox
        id: senha_fd
        run: |
          # NL-2.27b: mesma correção do autoteste (set +e antes do log).
          set +e
          bash flatpak/host/senha_fd.sh io.github.petrinhu.notalivre > "$RUNNER_TEMP/senha_fd.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/senha_fd.log"
          exit "$rc"

      - name: Resumo do smoke no host
        if: always()
        run: |
          {
            echo "## Flatpak (NL-0.5): smoke no host do runner (plano B)"
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| Runtime e bundle | ${{ steps.instalar.outcome }} |"
            echo "| Smoke QML offscreen | ${{ steps.smoke.outcome }} |"
            echo "| TCP 127.0.0.1 | ${{ steps.tcp.outcome }} |"
            echo "| os-release | ${{ steps.osrelease.outcome }} |"
            echo "| Autoteste do medidor da senha (NL-2.27) | ${{ steps.senha_fd_autoteste.outcome }} |"
            echo "| Senha por descritor no sandbox (NL-2.27) | ${{ steps.senha_fd.outcome }} |"
            echo "| CAs do runtime KDE 6.11 (NL-2.10e, E2) | ${{ steps.cas_runtime.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Mutação do portão de segredos (L-36 e L-27): o gitleaks TEM de reprovar a própria sabotagem, pelo motivo esperado.
  # Sabota só cópias em $RUNNER_TEMP. Desde 23/11/2026 (NF-12; L-35, item 3) só o portão de segurança é sabotado:
  # A2, travessão, SPDX, hex e Flatpak 6.11 saíram da mutação do CI.
  mutacao:
    name: mutação do portão de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Imagem de higiene (mesma do job higiene)
        run: docker build -t notalivre-higiene:ci -f tools/portoes/higiene.Dockerfile tools/portoes

      - name: Sabotagem e veredito do portão de segredos
        id: mutacao
        env:
          HIGIENE_IMAGEM: notalivre-higiene:ci
          NL_PORTOES: gitleaks
        run: bash tools/mutacao/sabotar_portoes.sh "$GITHUB_SHA" "$RUNNER_TEMP/mutacao" docker

      # A0-15 (L-36): o próprio harness precisa reprovar quando um portão não reprova. Sabota o harness
      # (o a2 roda sem sabotagem) e exige rc 1. Se der rc diferente de 1, o harness é verde falso e o job cai.
      - name: Controle do harness (o veredito tem de sair 1)
        id: controle_harness
        env:
          HIGIENE_IMAGEM: notalivre-higiene:ci
          MUTACAO_CONTROLE_HARNESS: "1"
        run: |
          rc=0
          bash tools/mutacao/sabotar_portoes.sh "$GITHUB_SHA" "$RUNNER_TEMP/mutacao-controle" docker || rc=$?
          echo "rc do controle do harness: $rc (esperado 1)"
          test "$rc" -eq 1

      # DA-2.60: linha fixa do resumo. Os mutantes do servidor falso rodam no job nativo ubuntu26.04, a cada push.
      - name: Nota dos mutantes do servidor falso (fixa)
        run: |
          printf '%s\n' '- Mutantes do servidor falso (CERT_OPTIONAL): rodam no job nativo ubuntu26.04 a cada push (DA-2.60), não aqui.' >> "$GITHUB_STEP_SUMMARY"
