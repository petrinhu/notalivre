# NotaLivre: manifesto Flatpak mínimo da NL-0.5 (spike medido, plano 0.5). App-id da rodada 6 (spec 4.1).
# Runtime KDE 6.11: o mais novo publicado no Flathub em 25/10/2026 (FATO medido; 6.12 não existe lá).
# CMake raiz pede Qt 6.11 como mínimo (decisão do orquestrador, cumprindo o plano: portão da Onda 9).
# Permissões: só as da lista da NL-0.5. Sem --filesystem=home e sem --socket=session-bus.
app-id: io.github.petrinhu.notalivre
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: notalivre-gui
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: notalivre
    buildsystem: simple
    build-commands:
      # NL-1.6a: o build não tem rede. O ZIP do XSD entra como fonte com SHA-256 (flatpak-builder confere) e o
      # CMake o lê por NL_XSD_ZIP_CACHE (diretório do próprio build, $PWD); o SHA do ZIP é conferido de novo pelo CMake.
      - cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNL_XSD_ZIP_CACHE="$PWD" -DNL_FLATPAK_BUILD=ON
      - cmake --build _build
      - install -Dm755 _build/apps/gui/notalivre-gui /app/bin/notalivre-gui
      - install -Dm755 _build/apps/cli/notalivre-cli /app/bin/notalivre-cli
    # DA-2.40 (b), achado 1 da revisão: só o slot assinaSha1NoSdkKdeSemVariavel roda aqui, depois do install, no sandbox
    # do SDK KDE 6.11. Os testes são compilados em _build e não são instalados. O gate reprova se o CTest não listar
    # exatamente 1 slot (piso, L-36) ou se o slot não passar exatamente 1 vez.
    run-tests: true
    test-commands:
      - |
        sh -c 'ctest --test-dir _build -N -R "xmldsig[.]assinaSha1NoSdkKdeSemVariavel$" > _build/nl-slot-listado.txt 2>&1; n=$(grep -c "xmldsig[.]assinaSha1NoSdkKdeSemVariavel$" _build/nl-slot-listado.txt || true); echo "slot listado pelo ctest: $n"; [ "$n" = 1 ] || { echo "PARADA: o ctest tem de listar exatamente 1 slot assinaSha1NoSdkKdeSemVariavel, achei $n"; exit 1; }'
      - |
        sh -c 'ctest --test-dir _build -R "xmldsig[.]assinaSha1NoSdkKdeSemVariavel$" --output-on-failure > _build/nl-slot-rodou.txt 2>&1; rc=$?; cat _build/nl-slot-rodou.txt; n=$(grep -c "Test *#[0-9]*: xmldsig[.]assinaSha1NoSdkKdeSemVariavel .* Passed" _build/nl-slot-rodou.txt || true); echo "slot aprovado: $n"; [ "$rc" = 0 ] && [ "$n" = 1 ] || { echo "PARADA: o slot nao passou exatamente 1 vez"; exit 1; }'
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - tools/conteiner
      - type: file
        url: https://www.gov.br/nfse/pt-br/biblioteca/documentacao-tecnica/producao-restrita/esquemas_prod_restrita_20261020.zip
        sha256: 25fdcecc651a67a216496ab10d7566631e6ed10f721e37d62c7845dadb0ea267
        dest-filename: esquemas_prod_restrita_20261020.zip
  - name: notalivre-qml-smoke
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: smoke
